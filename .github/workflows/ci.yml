name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          UPSTASH_REDIS_REST_URL: http://localhost:8080
          UPSTASH_REDIS_REST_TOKEN: test-token

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
        env:
          VITE_API_URL: http://localhost:4000
          VITE_WS_URL: ws://localhost:4000

  e2e-webrtc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frontend deps (harness runs the real peer module)
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Install rig deps
        run: bun install --frozen-lockfile
        working-directory: e2e
      - name: Type check the rig
        run: bun run typecheck
        working-directory: e2e
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # Two real browsers negotiating real SDP/ICE and pushing real media. This is
      # the only check that covers the parts of the stack jsdom cannot reach.
      - name: Run browser WebRTC rig
        run: bunx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend ./backend
      - name: Build frontend image
        # VITE_* are inlined at build time and production refuses to build
        # without VITE_API_URL, so they must be passed as build args.
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:4000 \
            --build-arg VITE_WS_URL=ws://localhost:4000 \
            -t frontend ./frontend
