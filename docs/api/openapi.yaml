openapi: "3.0.3"
info:
  title: Basic WebRTC API
  description: REST API for the Basic WebRTC video conferencing application.
  version: "1.0.0"

servers:
  - url: http://localhost:4000
    description: Local development

security:
  - BearerAuth: []

paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Account created, verification email sent
        "409":
          description: Email already registered

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      responses:
        "200":
          description: New access token issued
        "401":
          description: Invalid or expired refresh token

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: Reset email sent (if account exists)

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Password reset
        "400":
          description: Invalid or expired token

  /api/rooms:
    get:
      tags: [Rooms]
      summary: List rooms the caller hosts or participated in (dashboard "Recent meetings")
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Up to 10 most recent rooms with live participant counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        hostId:
                          type: string
                        title:
                          type: string
                        isLocked:
                          type: boolean
                        maxParticipants:
                          type: integer
                        participantCount:
                          type: integer
                        hostName:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                          format: date-time
                        endedAt:
                          type: string
                          format: date-time
                          nullable: true
    post:
      tags: [Rooms]
      summary: Create a new room
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                type:
                  type: string
                  enum: [open, locked, waiting-room]
      responses:
        "201":
          description: Room created

  /api/rooms/{id}:
    get:
      tags: [Rooms]
      summary: Get room details including feature settings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room with participant count and enforced settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    type: object
                    properties:
                      id:
                        type: string
                      hostId:
                        type: string
                      title:
                        type: string
                      isLocked:
                        type: boolean
                      maxParticipants:
                        type: integer
                      participantCount:
                        type: integer
                      hostName:
                        type: string
                      hasPasscode:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      endedAt:
                        type: string
                        format: date-time
                        nullable: true
                      settings:
                        type: object
                        properties:
                          allowChat:
                            type: boolean
                            description: Enforced by the chat WS handler and AdminPanel toggle
                          allowScreenShare:
                            type: boolean
                            description: Enforced by media-state gating and the control bar
                          muteOnJoin:
                            type: boolean
                            description: Client mutes local mic on room entry
                          waitingRoomEnabled:
                            type: boolean
                          maxRecordingDurationMins:
                            type: integer
                            description: Client stops local recording at this cap
        "404":
          description: Room not found or ended

  /api/rooms/{id}/state:
    get:
      tags: [Rooms]
      summary: Get room state (reactions, lock, participant count)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room state
        "404":
          description: Room not found

  /api/rooms/{id}/messages:
    get:
      tags: [Rooms]
      summary: Fetch recent chat history for a room
      description: >-
        Requires an authenticated session (Bearer access token) and membership
        in the room: the host, a currently connected peer, or a participant
        recorded in room_participants — so past attendees can still read
        history after the call ends. Waiting-room occupants are rejected until
        admitted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Last 50 messages, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        roomId:
                          type: string
                        userId:
                          type: string
                        content:
                          type: string
                        type:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
        "401":
          description: Unauthorized
        "403":
          description: Not a member of the room
        "404":
          description: Room not found

  /api/rooms/{id}/join:
    post:
      tags: [Rooms]
      summary: Join an existing room
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                passcode:
                  type: string
      responses:
        "200":
          description: Joined room, returns room token
        "403":
          description: Room locked or passcode required

  /api/rooms/{id}/end:
    post:
      tags: [Rooms]
      summary: End a room (host only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room ended
        "403":
          description: Not host

  /api/ice-servers:
    get:
      tags: [ICE]
      summary: Get ICE/TURN server credentials
      security:
        - BearerAuth: []
      responses:
        "200":
          description: ICE server configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  iceServers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ICEServer"

  /api/recordings/{roomId}/status:
    get:
      tags: [Recordings]
      summary: Get recording status for a room
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recording status (metadata only; media stays on clients)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  startedAt:
                    type: string
                  participantCount:
                    type: integer
        "403":
          description: Not a member of this room
        "404":
          description: No recording session for this room

  /api/rooms/{roomId}/transcript:
    get:
      tags: [Notes]
      summary: Fetch the persisted live transcript (caption finals)
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 2000
      responses:
        "200":
          description: Transcript segments, oldest first
        "403":
          description: Not a room participant

  /api/rooms/{roomId}/notes:
    get:
      tags: [Notes]
      summary: Latest generated meeting notes (or null)
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "`notes` object or null"
        "403":
          description: Not a room participant
    post:
      tags: [Notes]
      summary: Generate notes from the transcript (local extractive engine, no external AI)
      security:
        - BearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                screenshots:
                  type: array
                  maxItems: 12
                  description: Per-browser IndexedDB blob refs (key + capturedAt); no upload
                  items:
                    type: object
                    required: [key, capturedAt]
                    properties:
                      key:
                        type: string
                      capturedAt:
                        type: integer
      responses:
        "201":
          description: Notes created and `notes_ready` published to the room
        "400":
          description: No transcript yet (captions were never on)
        "403":
          description: Not a room participant

  /api/account/export:
    post:
      tags: [Account]
      summary: Request data export
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Export started
        "429":
          description: Rate limited

  /api/account/delete:
    post:
      tags: [Account]
      summary: Schedule account deletion (30-day grace period)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmation]
              properties:
                password:
                  type: string
                confirmation:
                  type: string
                  description: Must be "DELETE MY ACCOUNT"
      responses:
        "200":
          description: Deletion scheduled
        "409":
          description: Active room exists

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          description: OK

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check (Redis + Postgres)
      responses:
        "200":
          description: All dependencies reachable
        "503":
          description: Dependency unavailable

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        accessToken:
          type: string

    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        twoFactorEnabled:
          type: boolean
        googleLinked:
          type: boolean

    ICEServer:
      type: object
      properties:
        urls:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        username:
          type: string
        credential:
          type: string
